name: Released documentation audit

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check_documentation.py
      - run: python scripts/check_release.py
