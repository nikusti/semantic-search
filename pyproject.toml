[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-local"
version = "0.6.0"
description = "Local multimodal file search for Raycast and Tinycast"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "transformers==5.19.0", "torch==2.14.1", "torchvision==0.29.1",
  "av==19.0.1", "pypdfium2==5.14.0", "pypdf==6.20.0", "python-docx==1.2.0",
  "huggingface-hub==1.33.0", "safetensors==0.8.0",
  "fastapi==0.143.0", "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "reportlab==5.0.1"]
reference = ["sentence-transformers==6.1.0", "scipy==1.18.1", "scikit-learn==1.9.1"]
mlx = ["mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@3d87e88402f307efbf68e568971aa887ee7d9ed0", "mlx==0.32.3", "sentencepiece==0.2.2", "llguidance==1.9.1", "requests==2.34.2"]

[tool.setuptools.package-data]
tinysearch = ["model_catalog.json", "coreml_assets.json"]

[project.scripts]
tinysearch = "tinysearch.cli:main"

[project.urls]
Repository = "https://github.com/nikusti/semantic-search"

[tool.setuptools.packages.find]
include = ["tinysearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
